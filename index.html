<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Solitaire</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Solitaire">
<meta name="theme-color" content="#1d5a3a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;background:#1d5a3a}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text&display=swap">
<style>
/* Layout: one-screen felt table. Top bar, then stock/waste/foundations row, then 7 tableau columns filling the rest. */
:root{
  --felt:#103434; --felt-edge:#0d2828; --card:#f6e7bf; --ink:#17191a; --cream:#f3e3b8;
  --slot:rgba(243,227,184,.55); --text:#f3e3b8;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --serif:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--felt);color:var(--text);font-family:var(--font);overflow:hidden;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 4px}
body{background-color:var(--felt);
  background-image:linear-gradient(to bottom,var(--felt) 0%,var(--felt) 34%,color-mix(in srgb,var(--felt) 55%,transparent) 52%,transparent 66%,transparent 86%,var(--felt) 100%),var(--skin-bg,url(cards/dog_background.jpg));
  background-size:100% 100%,cover;background-position:center,center bottom;background-repeat:no-repeat}
@media (min-aspect-ratio:3/4){
  body{background-size:100% 100%,auto 100%;background-position:center,center}
  #app{max-width:600px;margin:0 auto}
}
#bar{display:flex;flex-direction:column;align-items:center;gap:0;padding-top:2px}
#title{margin:0;font:400 30px/1.1 var(--serif);color:var(--cream);letter-spacing:.01em;display:flex;align-items:center;gap:12px}
#title::before,#title::after{content:"";width:28px;height:1.5px;background:var(--cream);opacity:.8}
#stats{font:400 14px var(--serif);color:var(--cream);opacity:.85;font-variant-numeric:tabular-nums;margin-top:2px}
#stats span{opacity:.6}
#foot{display:flex;gap:12px;justify-content:center;padding-top:6px}
button{font:400 18px var(--serif);color:var(--cream);background:color-mix(in srgb,var(--felt) 88%,transparent);border:1.5px solid var(--cream);border-radius:14px;
  min-height:46px;padding:0 18px;cursor:pointer;flex:1;max-width:180px}
button:active{background:rgba(0,0,0,.6)}
button:disabled{opacity:.4}
button:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
#board{position:relative;flex:1;margin-top:8px}
.c,.slot{position:absolute;box-sizing:border-box;border-radius:7%/4.7%}
.slot{border:1.5px solid var(--slot);display:flex;align-items:center;justify-content:center;color:var(--slot);background:color-mix(in srgb,var(--felt) 35%,transparent)}
.c{background:var(--card) center/100% 100% no-repeat;box-shadow:0 1px 2px rgba(0,0,0,.45);overflow:hidden}
.ix{position:absolute;left:0;right:0;top:0;height:33%;box-sizing:border-box;padding:2px 0 0 3px;
  background:linear-gradient(var(--card) 78%,rgba(246,231,191,0));font:700 1em/1 var(--serif);
  letter-spacing:-.06em;white-space:nowrap;color:#1b2626}
.ix.r{color:#c0392b}
@media (max-width:500px){#app{padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}}
.hint{outline:3px solid #f2c14e;outline-offset:1px;z-index:5;animation:glow 1s ease-in-out 2}
@keyframes glow{50%{outline-color:rgba(242,193,78,.25)}}
#finish{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  max-width:none;width:auto;padding:0 36px;background:var(--cream);color:#123030;font-weight:700;box-shadow:0 4px 18px rgba(0,0,0,.5)}
@media (min-aspect-ratio:3/4){ #finish{position:static;transform:none;flex:1;max-width:180px;padding:0 18px} }
#level,#skins{display:flex;gap:4px;margin-top:4px}
#level button,#skins button{flex:none;min-height:30px;padding:0 12px;font-size:14px;border-radius:999px;border-width:1px;background:transparent;opacity:.75}
#level button[aria-pressed="true"],#skins button[aria-pressed="true"]{background:var(--cream);color:#123030;opacity:1}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:color-mix(in srgb,var(--felt) 95%,transparent);border:1.5px solid var(--cream);color:var(--cream);font:400 16px var(--serif);
  padding:10px 16px;border-radius:12px;white-space:nowrap}
.shake{animation:shake .18s linear}
@keyframes shake{25%{translate:-3px 0}75%{translate:3px 0}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
#win{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
#win .box{background:var(--felt);border-radius:16px;padding:24px 28px;text-align:center;min-width:220px;
  box-shadow:0 8px 30px rgba(0,0,0,.4)}
#win h2{margin:0 0 14px;font-size:26px}
#win p{margin:4px 0;font-size:20px;font-variant-numeric:tabular-nums}
#win h2,#win p{font-family:var(--serif);font-weight:400;color:var(--cream)}
#win .box{border:1.5px solid var(--cream)}
#win button{margin-top:18px;width:100%;max-width:none;min-height:48px;font-size:17px;background:var(--card);color:var(--ink)}
</style>

<div id="app">
  <div id="bar">
    <h1 id="title">Solitaire</h1>
    <div id="stats"></div>
    <div id="level" role="group" aria-label="Difficulty"><button type="button" data-l="easy">Easy</button><button type="button" data-l="normal">Normal</button><button type="button" data-l="hard">Hard</button></div>
    <div id="skins" role="group" aria-label="Card style"></div>
  </div>
  <div id="board"></div>
  <div id="foot">
    <button id="deal" type="button">Reshuffle</button>
    <button id="undo" type="button">Undo</button>
    <button id="hint" type="button">Hint</button>
    <button id="finish" type="button" hidden>Finish</button>
  </div>
  <div id="toast" hidden></div>
</div>
<div id="win" hidden>
  <div class="box">
    <h2>You won</h2>
    <p id="wMoves"></p>
    <p id="wTime"></p>
    <button id="again" type="button">Deal again</button>
  </div>
</div>

    `<div class="c" style="left:${left}px;top:${top}px;width:${W}px;height:${H}px;background-image:url(${img(c)})" ${data}>` +
    (big && c.u ? `<span class="ix${isRed(c.s) ? ' r' : ''}" style="font-size:${ixFont}px">${RANKS[c.r]}${SUITS[c.s]}</span>` : '') + `</div>`;
  const slot = (left, top, data, label, size) =>
    `<div class="slot" style="left:${left}px;top:${top}px;width:${W}px;height:${H}px;font-size:${size}px" ${data}>${label}</div>`;

  // stock
  if (S.stock.length) parts.push(card({ u:false }, x(6), 0, 'data-z="stock"'));
  else parts.push(slot(x(6), 0, 'data-z="stock"', S.waste.length ? '↻' : '', Math.round(W * 0.5)));
  // waste
  if (S.waste.length > 1) parts.push(card(S.waste[S.waste.length-2], x(5), 0, 'data-z="waste"'));
  if (S.waste.length) parts.push(card(S.waste[S.waste.length-1], x(5), 0, 'data-z="waste"'));
  // foundations
  for (let s = 0; s < 4; s++) {
    const f = S.found[s];
    if (f.length) parts.push(card(f[f.length-1], x(s), 0, `data-z="found" data-c="${s}"`));
    else parts.push(slot(x(s), 0, `data-z="found" data-c="${s}"`, SUITS[s], Math.round(W * 0.5)));
  }
  // tableau
  const top0 = H + gap * 3, avail = bh - top0 - 2;
  S.tab.forEach((col, k) => {
    parts.push(slot(x(k), top0, `data-z="tab" data-c="${k}" data-i="0"`, '', 0));
    let dDown = H * 0.12, dUp = H * 0.33;
    let need = 0; for (let i = 0; i < col.length - 1; i++) need += col[i].u ? dUp : dDown;
    const scale = need > 0 && need + H > avail ? Math.max(0.2, (avail - H) / need) : 1;
    let y = top0;
    col.forEach((c, i) => {
      parts.push(card(c, x(k), Math.round(y), `data-z="tab" data-c="${k}" data-i="${i}"`));
      y += (c.u ? dUp : dDown) * scale;
    });
  });
  board.innerHTML = parts.join('');
  $('stats').innerHTML = `Won ${stats.w} <span>·</span> Lost ${stats.l}`;
  $('finish').hidden = !canAutoFinish();
  $('undo').disabled = !undoStack.length || S.won;
}

board.addEventListener('click', e => {
  const el = e.target.closest('[data-z]'); if (!el) return;
  const z = el.dataset.z, c = +el.dataset.c, i = +el.dataset.i;
  if (z === 'stock') return act(drawStock, el);
  if (z === 'waste') return act(() => moveFrom(S.waste, S.waste.length - 1, 'waste'), el);
  if (z === 'found') return act(() => moveFrom(S.found[c], S.found[c].length - 1, 'found'), el);
  if (z === 'tab') return act(() => moveFrom(S.tab[c], i, 'tab', c), el);
});
$('undo').addEventListener('click', undo);
$('hint').addEventListener('click', hint);
document.querySelectorAll('#level button').forEach(b => b.addEventListener('click', () => setLevel(b.dataset.l)));
renderLevel();
if (SKINS[store.get('qs-skin')]) skin = store.get('qs-skin');
const skinBox = $('skins');
skinBox.innerHTML = Object.entries(SKINS).map(([id, k]) => `<button type="button" data-s="${id}">${k.name}</button>`).join('');
skinBox.hidden = Object.keys(SKINS).length < 2;
skinBox.querySelectorAll('button').forEach(b => b.addEventListener('click', () => setSkin(b.dataset.s)));
applySkin();
$('finish').addEventListener('click', () => { if (canAutoFinish()) { startClock(); autoFinish(); } });
$('deal').addEventListener('click', reshuffle);
$('again').addEventListener('click', newGame);
addEventListener('resize', () => render());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pauseClock(); save(); } else startClock();
});
addEventListener('pagehide', () => { pauseClock(); save(); });

// resume a saved game, or deal a new one
const saved = store.get('qs-game');
if (saved && saved.tab && !saved.won && saved.deal !== undefined) {  // games from before winnable deals start fresh
  S = saved; render(); startClock();
  if (!S.stock.length && !S.waste.length && S.tab.every(col => col.every(c => c.u))) autoFinish();
}
else newGame();
})();
</script>

<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
